<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio Data de Danielle</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===== THEME SLATE + OR ===== */

:root {
--primary-slate:#2f3e46;
--accent-gold:#d4af37;
--bg-light:#f8f8f8;
--text-dark:#0f172a;
--btn-hover:#c49b2d;
}

/* BODY */

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:var(--bg-light);
color:var(--text-dark);
overflow-x:hidden;
}

a{text-decoration:none;color:inherit;}

header{
text-align:center;
padding:120px 20px 60px;
background:linear-gradient(to right,var(--bg-light),#e0e6e9);
}

header h1{
font-size:42px;
margin:0;
color:var(--primary-slate);
}

header p{
color:var(--primary-slate);
}

/* NAVIGATION */

nav{
position:fixed;
top:0;
width:100%;
background:var(--primary-slate);
padding:15px;
text-align:center;
z-index:1000;
display:flex;
justify-content:space-between;
align-items:center;
}

nav .nav-links{
display:flex;
gap:12px;
}

nav .nav-links a{
color:white;
font-weight:500;
padding:5px 8px;
}

nav .nav-links a:hover{
color:var(--accent-gold);
}

.nav-toggle{
display:none;
cursor:pointer;
font-size:20px;
color:white;
}

@media(max-width:900px){

.nav-links{
display:none;
flex-direction:column;
background:var(--primary-slate);
position:absolute;
top:55px;
left:0;
width:100%;
text-align:center;
}

.nav-links.show{
display:flex;
}

.nav-toggle{
display:block;
}

}

/* SECTIONS */

section{
max-width:1100px;
margin:auto;
padding:60px 20px;
}

h2{
padding-left:0;
margin-bottom:25px;
color:var(--primary-slate);
font-size:28px;
border:none;
}

/* PROFIL */

.profil{
display:flex;
gap:40px;
flex-wrap:wrap;
align-items:center;
}

.profil img{
width:180px;
border-radius:50%;
border:4px solid var(--accent-gold);
}

.slider{
margin-top:15px;
display:flex;
align-items:center;
gap:10px;
}

.slider button{
padding:4px 8px;
background:var(--primary-slate);
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

.slider button:hover{
background:var(--accent-gold);
color:var(--primary-slate);
}

/* CARDS / PROJETS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.card,.project{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.05);
transition:0.3s;
color:inherit;
}

.card:hover,.project:hover{
transform:translateY(-5px);
box-shadow:0 12px 30px rgba(0,0,0,0.1);
}

.project img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.btn{
display:inline-block;
margin-top:8px;
padding:6px 10px;
background:var(--primary-slate);
color:white;
border-radius:5px;
font-size:13px;
}

.btn:hover{
background:var(--accent-gold);
color:var(--primary-slate);
}

.details{
display:none;
margin-top:10px;
background:#f1f5f9;
padding:10px;
border-radius:8px;
font-size:14px;
}

/* TIMELINE */

.timeline{
position:relative;
max-width:900px;
margin:auto;
}

.timeline::after{
content:'';
position:absolute;
width:3px;
background:var(--accent-gold);
top:0;
bottom:0;
left:50%;
}

.timeline-item{
padding:20px 40px;
position:relative;
width:50%;
}

.timeline-item:nth-child(odd){
left:0;
}

.timeline-item:nth-child(even){
left:50%;
}

.timeline-content{
background:white;
padding:20px;
border-radius:10px;
}

/* SKILLS */

.skills-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.skill-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.05);
color:var(--primary-slate);
font-weight:500;
}

/* CONTACT */

.contact{
text-align:center;
padding:40px;
background:#f1f5f9;
}

.contact a{
color:var(--primary-slate);
}

.contact a:hover{
color:var(--accent-gold);
}

/* PROJECT FILTERS */

.project-filters{
margin-bottom:20px;
text-align:center;
}

.project-filters button{
margin:0 5px;
padding:6px 12px;
background:var(--primary-slate);
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.project-filters button:hover{
background:var(--accent-gold);
}

.project-filters button.active{
background:var(--accent-gold);
color:white;
}

/* ===== MOBILE OPTIMISATION ===== */

@media(max-width:900px){

header{
padding:90px 20px 40px;
}

header h1{
font-size:28px;
}

section{
padding:40px 15px;
}

.profil{
flex-direction:column;
text-align:center;
}

.cards{
grid-template-columns:1fr;
}

.project img{
height:160px;
}

/* timeline mobile */

.timeline::after{
left:20px;
}

.timeline-item{
width:100%;
left:0 !important;
padding:15px 20px 15px 40px;
}

}

</style>
</head>

<body>

<nav>
<div class="nav-logo"><strong>Portfolio Danielle</strong></div>

<div class="nav-toggle" onclick="toggleMenu()">☰</div>

<div class="nav-links">
<a href="#profil">Profil</a>
<a href="#competences">Compétences</a>
<a href="#skills">Soft & Hard Skills</a>
<a href="#projets">Projets ▼</a>
<a href="#experience">Expérience</a>
<a href="#formations">Formations</a>
<a href="#diplomes">Diplômes</a>
<a href="#documents">Documents</a>
<a href="#contact">Contact</a>
<a href="#centres">Centres d’intérêt</a>
</div>
</nav>

<header>
<h1>Data Analyst orientée Décisionnel</h1>
<p>Chargée de missions actuarielles | CAVOM</p>
</header>

<!-- le reste de ton HTML reste EXACTEMENT identique -->

<script>

function toggleDetails(btn){
const d=btn.nextElementSibling;
d.style.display=d.style.display==='block'?'none':'block';
}

function changeExp(dir){
const el=document.getElementById("expText");
if(dir===1){
el.innerHTML="<strong>Expérience Data : 3 ans</strong>"
}else{
el.innerHTML="<strong>Spécialisation : Data & Actuariat</strong>"
}
}

new Chart(document.getElementById("skillsChart"),{
type:"radar",
data:{
labels:["SQL","Python","Stats","Machine Learning","Power BI","Viz"],
datasets:[{
data:[80,80,80,75,80,80],
backgroundColor:"rgba(212,175,55,0.2)",
borderColor:"#d4af37"
}]
}
});

function toggleMenu(){
document.querySelector('.nav-links').classList.toggle('show');
}

function filterProjects(cat){

const projects=document.querySelectorAll('.cards .project');

projects.forEach(p=>{
if(cat==='all'||p.dataset.category===cat){
p.style.display='block';
}else{
p.style.display='none';
}
});

document.querySelectorAll('.project-filters button')
.forEach(b=>b.classList.remove('active'));

event.target.classList.add('active');
}

</script>

<footer style="text-align:center;padding:20px;background:#2f3e46;color:#d4af37;font-size:13px;">
© Danielle 2026 | Data Portfolio
</footer>

</body>
</html>
